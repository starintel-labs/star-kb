name: shared-service
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-swi-http-zmq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: lost-rob0t/star-lang
          ref: bfba04a15f43215cd323e1dde2d98a7343abb3ea
          path: .deps/star-lang
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install Python clients
        run: python3 -m pip install -r service/requirements.txt
      - name: Real pinned runtime, integration and regression gates
        env:
          STARLANG_ROOT: ${{ github.workspace }}/.deps/star-lang
        run: |
          export KB_TEST_PYTHON="$(command -v python3)"
          nix develop ./.deps/star-lang --command bash -c '
            set -euo pipefail
            export STAR_KB_SBCL="$(command -v sbcl)"
            export CL_SOURCE_REGISTRY="$STARLANG_ROOT//:$CL_SOURCE_REGISTRY"
            sbcl --version
            "$STARLANG_SWI_EXECUTABLE" --version
            timeout 90 sbcl --noinform --disable-debugger --script service/worker.lisp < service/empty-snapshot.json
            "$KB_TEST_PYTHON" -m unittest discover -s tests -p "test_*.py" -v
            "$KB_TEST_PYTHON" scripts/sync.py
            "$KB_TEST_PYTHON" scripts/sync.py --check
            "$KB_TEST_PYTHON" scripts/validate-docs.py
            "$KB_TEST_PYTHON" service/benchmark.py > benchmark.json
          '
      - uses: actions/upload-artifact@v4
        with:
          name: shared-service-evidence
          path: benchmark.json
